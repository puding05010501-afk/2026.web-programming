<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    // 단순 팝업
    alert('Hello, world!!');
    // Yes or No
    let input = confirm("Really?");
    // 입력 팝업
    input = prompt('이름을 적으십시오.');
</script>
<body>
    <h1>자바스크립트 입력</h1>
    <script>
        document.write('<h2>나는 문자열이다.</h2>');
    </script>
    당신의 이름은 <script>document.write(input);</script>
</body>
</html>

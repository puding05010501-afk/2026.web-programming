<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1> 구구단을 외자 </h1>
    <script>
        let mul = 2;
        while (mul <= 9) {

        let i = 1;
        while ( i <= 9) {
            document.write(mul + "x" + i + "=" + mul * i + "<br>");
            i++
        }

        if (mul < 9) {
            document.write("<br>");
        }

        mul++;
        }
    </script>
</body>
</html>

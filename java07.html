<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> 1부터 100까지 짝수의 합</h1>
    <script>
        let sum = 0;
        let i = 0;
        while ( i <= 100 ) {
            if ( i % 2 == 0)
        {
            sum = sum + i; }
        i++ ;
        document.write( sum + '<br>' )
        }
    </script>
</body>
</html>

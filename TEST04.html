<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>계산기</title>
    <style>
/* Windows 11 계산기(표준 모드) 스타일 — 시스템 테마에 따라 라이트/다크 자동 전환 */

:root {
  --bg: #f3f3f3;
  --text: #1b1b1b;
  --text-sub: #5f5f5f;
  --text-disabled: #a0a0a0;
  --key-num: #ffffff;
  --key-num-hover: #f7f7f7;
  --key-op: #f9f9f9;
  --key-op-hover: #f0f0f0;
  --key-pressed: #ececec;
  --key-stroke: rgba(0, 0, 0, 0.07);
  --accent: #005fb8;
  --accent-hover: #1a6fc0;
  --accent-pressed: #3380c7;
  --accent-text: #ffffff;
  --subtle-hover: rgba(0, 0, 0, 0.05);
  --subtle-pressed: rgba(0, 0, 0, 0.03);
  --flyout: #f9f9f9;
  --flyout-stroke: rgba(0, 0, 0, 0.1);
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202020;
    --text: #ffffff;
    --text-sub: #c5c5c5;
    --text-disabled: #6b6b6b;
    --key-num: #3b3b3b;
    --key-num-hover: #323232;
    --key-op: #323232;
    --key-op-hover: #3b3b3b;
    --key-pressed: #282828;
    --key-stroke: rgba(255, 255, 255, 0.04);
    --accent: #4cc2ff;
    --accent-hover: #47b1e8;
    --accent-pressed: #42a1d2;
    --accent-text: #000000;
    --subtle-hover: rgba(255, 255, 255, 0.07);
    --subtle-pressed: rgba(255, 255, 255, 0.04);
    --flyout: #2c2c2c;
    --flyout-stroke: rgba(0, 0, 0, 0.35);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
  font-size: 14px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  cursor: default;
}

button:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: -2px;
}

svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- 전체 배치 ---------- */

.app {
  position: relative;
  display: flex;
  height: 100vh;
  height: 100dvh;
  min-width: 320px;
  min-height: 460px;
}

.calc {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* ---------- 상단 표시줄 ---------- */

.top {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 48px;
  padding: 0 4px;
  flex: none;
}

.mode {
  margin: 0 0 2px 4px;
  font-size: 20px;
  font-weight: 600;
}

.spacer {
  flex: 1;
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 40px;
  height: 36px;
  border-radius: 4px;
}

.icon-btn:hover {
  background: var(--subtle-hover);
}

.icon-btn:active {
  background: var(--subtle-pressed);
}

/* ---------- 표시 영역 ---------- */

.screen {
  flex: 1 1 0;
  min-height: 100px;
  max-height: 28vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 14px 4px;
  text-align: right;
}

.expression {
  min-height: 20px;
  font-size: 14px;
  color: var(--text-sub);
  white-space: nowrap;
  overflow: hidden;
  direction: rtl; /* 길어지면 앞부분을 잘라 최근 입력이 보이도록 */
  unicode-bidi: plaintext;
}

.display {
  height: 64px;
  line-height: 64px;
  font-family: 'Segoe UI Variable Display', 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
  font-size: 46px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  -webkit-user-select: text;
  user-select: text;
}

/* ---------- 메모리 줄 ---------- */

.memory-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  padding: 0 4px;
  height: 34px;
  flex: none;
}

.memory-row button {
  border-radius: 4px;
  font-size: 12px;
}

.memory-row button:hover:not(:disabled) {
  background: var(--subtle-hover);
}

.memory-row button:active:not(:disabled) {
  background: var(--subtle-pressed);
}

.chevron {
  font-size: 9px;
  margin-left: 1px;
}

button:disabled {
  color: var(--text-disabled);
}

/* ---------- 키패드 ---------- */

.keys {
  flex: 3 1 0;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 2px;
  padding: 2px 4px 4px;
}

.key {
  display: grid;
  place-items: center;
  grid-auto-flow: column;
  justify-content: center;
  border: 1px solid var(--key-stroke);
  border-radius: 4px;
  font-size: 14px;
  transition: background-color 0.08s;
}

.key.num {
  background: var(--key-num);
  font-size: 18px;
  font-weight: 600;
}

.key.op {
  background: var(--key-op);
}

.key.sym {
  font-size: 22px;
  font-weight: 400;
}

.key.fn {
  font-size: 18px;
}

.key.fn sup {
  margin: 0 1px;
}

.key .x {
  font-family: 'Cambria Math', 'Times New Roman', serif;
  font-style: italic;
}

.key sup,
.key sub {
  font-size: 0.62em;
  line-height: 1;
  position: relative;
  top: -0.5em; /* 그리드 항목이라 vertical-align 이 적용되지 않아 직접 올림 */
}

.key sub {
  top: 0.25em;
}

.key.num:hover:not(:disabled) {
  background: var(--key-num-hover);
}

.key.op:hover:not(:disabled) {
  background: var(--key-op-hover);
}

.key.num:active:not(:disabled),
.key.op:active:not(:disabled),
.key.num.pressed,
.key.op.pressed {
  background: var(--key-pressed);
  color: var(--text-sub);
}

.key.equals {
  background: var(--accent);
  color: var(--accent-text);
  border-color: transparent;
}

.key.equals:hover {
  background: var(--accent-hover);
}

.key.equals:active,
.key.equals.pressed {
  background: var(--accent-pressed);
}

/* ---------- 기록 / 메모리 패널 ---------- */

.panel {
  display: flex;
  flex-direction: column;
  width: 320px;
  flex: none;
  padding-top: 8px;
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 0 12px;
  height: 40px;
  flex: none;
}

.tab {
  position: relative;
  padding: 0 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-sub);
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  color: var(--text);
}

.tab.active::after {
  content: '';
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 4px;
  height: 3px;
  border-radius: 2px;
  background: var(--accent);
}

.panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px;
}

.empty {
  margin: 12px 12px 0;
  font-size: 14px;
  font-weight: 600;
}

.list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.list li {
  padding: 8px 12px;
  border-radius: 4px;
  text-align: right;
}

.list li:hover {
  background: var(--subtle-hover);
}

.list li:active {
  background: var(--subtle-pressed);
}

.item-expr {
  font-size: 14px;
  color: var(--text-sub);
  overflow-wrap: anywhere;
}

.item-value {
  font-size: 24px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.item-actions {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 4px;
  visibility: hidden;
}

.list li:hover .item-actions,
.list li:focus-within .item-actions {
  visibility: visible;
}

.item-actions button {
  min-width: 40px;
  height: 28px;
  padding: 0 8px;
  border: 1px solid var(--key-stroke);
  border-radius: 4px;
  background: var(--key-num);
  font-size: 12px;
}

.item-actions button:hover {
  background: var(--key-num-hover);
}

.panel-foot {
  display: flex;
  justify-content: flex-end;
  padding: 4px;
  flex: none;
}

.scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* 넓은 창: 패널이 항상 옆에 보이고, 기록/메모리 열기 버튼은 숨김 */
@media (min-width: 560px) {
  #historyBtn,
  #memOpen {
    visibility: hidden;
  }

  .memory-row {
    grid-template-columns: repeat(5, 1fr) 0;
  }

  #scrim.for-panel {
    display: none;
  }
}

/* 좁은 창: 패널이 키패드 위로 열림 */
@media (max-width: 559.98px) {
  .panel {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    height: 64%;
    background: var(--flyout);
    border-top: 1px solid var(--flyout-stroke);
    border-radius: 8px 8px 0 0;
    box-shadow: var(--shadow);
    transform: translateY(100%);
    visibility: hidden;
    transition: transform 0.16s ease-out, visibility 0s 0.16s;
  }

  .panel.open {
    transform: none;
    visibility: visible;
    transition: transform 0.16s ease-out;
  }

  .tabs {
    display: none;
  }
}

/* ---------- 탐색 메뉴 ---------- */

.nav {
  position: absolute;
  z-index: 3;
  top: 0;
  left: 0;
  bottom: 0;
  width: 256px;
  padding: 6px 4px;
  background: var(--flyout);
  border-right: 1px solid var(--flyout-stroke);
  border-radius: 0 8px 8px 0;
  box-shadow: var(--shadow);
}

.nav[hidden] {
  display: none;
}

.nav-title {
  margin: 10px 12px 6px;
  font-size: 14px;
  font-weight: 600;
}

.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  height: 36px;
  padding: 0 12px;
  border-radius: 4px;
  font-size: 14px;
}

.nav-item:hover,
.nav-item.selected {
  background: var(--subtle-hover);
}

.nav-item.selected::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 2px;
  background: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <!-- 계산기 본체 -->
      <section class="calc" aria-label="표준 계산기">
        <header class="top">
          <button class="icon-btn" id="navBtn" type="button" aria-label="탐색 열기" title="탐색 열기">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" /></svg>
          </button>
          <h1 class="mode">표준</h1>
          <span class="spacer"></span>
          <button class="icon-btn" id="historyBtn" type="button" aria-label="기록 (Ctrl+H)" title="기록 (Ctrl+H)">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.6 8a5.4 5.4 0 1 0 1.7-3.9" />
              <path d="M2.2 2.4v2.9h2.9" />
              <path d="M8 5v3.2l2.2 1.3" />
            </svg>
          </button>
        </header>

        <div class="screen">
          <div class="expression" id="expression" aria-label="수식"></div>
          <div class="display" id="display" role="status" aria-live="polite">0</div>
        </div>

        <div class="memory-row" role="group" aria-label="메모리 컨트롤">
          <button type="button" id="memClear" data-action="mc" title="모든 메모리 지우기 (Ctrl+L)">MC</button>
          <button type="button" id="memRecall" data-action="mr" title="메모리 불러오기 (Ctrl+R)">MR</button>
          <button type="button" data-action="m+" data-error-off title="메모리 더하기 (Ctrl+P)">M+</button>
          <button type="button" data-action="m-" data-error-off title="메모리 빼기 (Ctrl+Q)">M-</button>
          <button type="button" data-action="ms" data-error-off title="메모리 저장 (Ctrl+M)">MS</button>
          <button type="button" id="memOpen" title="메모리">M<span class="chevron">&#x2228;</span></button>
        </div>

        <div class="keys" role="group" aria-label="키패드">
          <button type="button" class="key op" data-action="percent" data-error-off aria-label="퍼센트">%</button>
          <button type="button" class="key op" data-action="ce" aria-label="입력 지우기">CE</button>
          <button type="button" class="key op" data-action="c" aria-label="지우기">C</button>
          <button type="button" class="key op" data-action="back" aria-label="백스페이스">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M5.6 3.5h7.9a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H5.6L1.5 8z" />
              <path d="M7.6 6l4 4m0-4l-4 4" />
            </svg>
          </button>

          <button type="button" class="key op fn" data-action="inv" data-error-off aria-label="역수"><sup>1</sup>/<span class="x">x</span></button>
          <button type="button" class="key op fn" data-action="sqr" data-error-off aria-label="제곱"><span class="x">x</span><sup>2</sup></button>
          <button type="button" class="key op fn" data-action="sqrt" data-error-off aria-label="제곱근"><sup>2</sup>&#x221A;<span class="x">x</span></button>
          <button type="button" class="key op sym" data-action="op" data-value="/" data-error-off aria-label="나누기">&#xF7;</button>

          <button type="button" class="key num" data-action="digit" data-value="7">7</button>
          <button type="button" class="key num" data-action="digit" data-value="8">8</button>
          <button type="button" class="key num" data-action="digit" data-value="9">9</button>
          <button type="button" class="key op sym" data-action="op" data-value="*" data-error-off aria-label="곱하기">&#xD7;</button>

          <button type="button" class="key num" data-action="digit" data-value="4">4</button>
          <button type="button" class="key num" data-action="digit" data-value="5">5</button>
          <button type="button" class="key num" data-action="digit" data-value="6">6</button>
          <button type="button" class="key op sym" data-action="op" data-value="-" data-error-off aria-label="빼기">&#x2212;</button>

          <button type="button" class="key num" data-action="digit" data-value="1">1</button>
          <button type="button" class="key num" data-action="digit" data-value="2">2</button>
          <button type="button" class="key num" data-action="digit" data-value="3">3</button>
          <button type="button" class="key op sym" data-action="op" data-value="+" data-error-off aria-label="더하기">+</button>

          <button type="button" class="key num sym" data-action="negate" data-error-off aria-label="양수/음수"><sup>+</sup>/<sub>&#x2212;</sub></button>
          <button type="button" class="key num" data-action="digit" data-value="0">0</button>
          <button type="button" class="key num" data-action="decimal" data-error-off aria-label="소수점">.</button>
          <button type="button" class="key equals sym" data-action="equals" aria-label="같음">=</button>
        </div>
      </section>

      <!-- 기록 / 메모리 패널 (넓은 창: 옆에 고정, 좁은 창: 아래에서 열림) -->
      <div class="scrim" id="scrim" hidden></div>
      <aside class="panel" id="panel" aria-label="기록 및 메모리">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" role="tab" data-tab="history" aria-selected="true">기록</button>
          <button type="button" class="tab" role="tab" data-tab="memory" aria-selected="false">메모리</button>
        </div>
        <div class="panel-body">
          <ul class="list" id="historyList"></ul>
          <ul class="list" id="memoryList" hidden></ul>
          <p class="empty" id="panelEmpty"></p>
        </div>
        <div class="panel-foot">
          <button class="icon-btn" id="panelClear" type="button" aria-label="모두 지우기" title="모두 지우기">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 4.5h11M6.3 4.5V3h3.4v1.5M4.2 4.5l.6 8.5h6.4l.6-8.5M6.8 7v3.8M9.2 7v3.8" />
            </svg>
          </button>
        </div>
      </aside>

      <!-- 탐색 메뉴 -->
      <nav class="nav" id="nav" aria-label="계산기 모드" hidden>
        <button class="icon-btn" id="navClose" type="button" aria-label="탐색 닫기">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" /></svg>
        </button>
        <p class="nav-title">계산기</p>
        <button type="button" class="nav-item selected" id="navStandard">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3" y="1.5" width="10" height="13" rx="1.5" />
            <path d="M5.5 4.5h5M5.6 8h.01M8 8h.01M10.4 8h.01M5.6 11h.01M8 11h.01M10.4 11h.01" />
          </svg>
          표준
        </button>
      </nav>
    </div>

    <script>
/*
 * rational.js — BigInt 기반 유리수 연산
 *
 * 자바스크립트의 부동소수점(0.1 + 0.2 = 0.30000000000000004) 문제를 피하기 위해
 * 모든 값을 분자/분모(BigInt) 쌍으로 다룹니다. Windows 계산기도 내부적으로
 * 유리수 연산을 사용하기 때문에 1 ÷ 3 × 3 = 1 과 같은 결과가 동일하게 나옵니다.
 */
(function (root) {
  'use strict';

  const SIG_DIGITS = 16; // 화면에 표시하는 유효 숫자 자릿수
  const KEEP_DIGITS = 60; // 내부적으로 유지하는 최소 유효 숫자 자릿수
  const SQRT_DIGITS = 40; // 제곱근 계산 정밀도
  const MAX_EXPONENT = 10000; // 이 자릿수를 넘으면 오버플로

  const abs = (x) => (x < 0n ? -x : x);
  const pow10 = (k) => 10n ** BigInt(k);
  const len = (x) => abs(x).toString().length;

  function gcd(a, b) {
    while (b) [a, b] = [b, a % b];
    return a;
  }

  // 반올림 나눗셈 (b > 0)
  function divRound(a, b) {
    const q = (2n * abs(a) + b) / (2n * b);
    return a < 0n ? -q : q;
  }

  function make(n, d = 1n) {
    if (d < 0n) {
      n = -n;
      d = -d;
    }
    let g = gcd(abs(n), d);
    if (g > 1n) {
      n /= g;
      d /= g;
    }
    // 분모가 지나치게 커지면 유효 숫자 약 60자리로 반올림해 크기를 제한
    if (d > pow10(80)) {
      const scale = KEEP_DIGITS + Math.max(0, len(d) - len(n));
      n = divRound(n * pow10(scale), d);
      d = pow10(scale);
      g = gcd(abs(n), d);
      if (g > 1n) {
        n /= g;
        d /= g;
      }
    }
    return { n, d };
  }

  const ZERO = make(0n);
  const HUNDRED = make(100n);

  // "-12.50" 같은 입력 문자열을 유리수로 변환
  function parse(str) {
    const neg = str.startsWith('-');
    if (neg) str = str.slice(1);
    const [int, frac = ''] = str.split('.');
    const n = BigInt((int || '0') + frac);
    return make(neg ? -n : n, pow10(frac.length));
  }

  const add = (a, b) => make(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => make(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => make(a.n * b.n, a.d * b.d);

      value === undefined
        ? `button[data-action="${action}"]`
        : `button[data-action="${action}"][data-value="${value}"]`;
    const button = document.querySelector(selector);
    if (!button) return;
    button.classList.add('pressed');
    setTimeout(() => button.classList.remove('pressed'), 110);
  }

  function isDisabled(action) {
    const button = document.querySelector(`button[data-action="${action}"]`);
    return Boolean(button && button.disabled);
  }

  async function paste() {
    try {
      const text = (await navigator.clipboard.readText()).replace(/[,\s]/g, '');
      if (!/^-?(\d+\.?\d*|\.\d+)$/.test(text)) return;
      calc.clearEntry();
      for (const ch of text.replace('-', '')) {
        if (ch === '.') calc.decimal();
        else calc.digit(ch);
      }
      if (text.startsWith('-')) calc.negate();
      render();
    } catch {
      /* 클립보드 권한이 없으면 무시 */
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.altKey) return;

    if (e.ctrlKey || e.metaKey) {
      const key = e.key.toLowerCase();
      if (e.shiftKey && key === 'd') {
        calc.historyClear();
        render();
      } else if (key === 'h') togglePanel('history');
      else if (key === 'c') {
        if (String(window.getSelection())) return; // 선택한 텍스트는 기본 복사
        navigator.clipboard?.writeText(calc.display.replace(/,/g, '')).catch(() => {});
      } else if (key === 'v') paste();
      else if (CTRL_KEYS[key]) {
        const action = CTRL_KEYS[key];
        if (!isDisabled(action)) run(action);
      } else return;
      e.preventDefault();
      return;
    }

    if (e.key === 'Escape' && (ui.panelOpen || ui.navOpen)) {
      closeOverlays();
      e.preventDefault();
      return;
    }

    const mapped = KEYS[e.key];
    if (!mapped) return;
    e.preventDefault(); // Enter 가 포커스된 버튼을 다시 누르는 것을 방지
    const [action, value] = mapped;
    if (isDisabled(action)) return;
    flash(action, value);
    run(action, value);
  });

  window.addEventListener('resize', fitDisplay);
  render();
})();
    </script>
  </body>
</html>

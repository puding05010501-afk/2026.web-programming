<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let number = prompt('점수를 입력하세요.');

switch (parseInt(number/10))
{   case 10:
    case 9:
        alert("A등급 입니다.")
    break;
    case 8:
        alert("B등급 입니다.")
    break;
    case 7:
        alert("C등급 입니다.")
    break;
    case 6:
        alert("D등급 입니다.")
    break;
    default:
        alert("F등급 입니다.")
}
</script>
<body>
    <h1> 성적 구분을 Switch case 구문으로</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표 만들기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Hi+Melody&display=swap" rel="stylesheet">
    <style>

         * { color: white; font-family: "Noto Sans KR", sans-serif; }
        body { background-color: #111111; margin: 20px; }
        p { color: gray; font-size: 20px; margin: 0; }
        h1 { font-size: 32px; margin: 0 0 20px 0; }
        table { border: 2px solid #333333; }
        th, td { border: 1px solid #333333; width: 90px; height: 50px; font-size: 20px; text-align: center; }
        th { height: 25px; color: gray; font-weight: normal; font-size: 14px; vertical-align: middle; }
        .e1 { width: 25px; color: gray; text-align: right; font-size: 14px; }
        .e2 { padding: 4px; }
        .e2 b { font-size: 15px; }
        .e3 { background-color: green; }
        .e4 { background-color: orangered; }
        .e5 { background-color: mediumturquoise; }
        .e6 { background-color: plum; }
        .e7 { background-color: orange; }
        .e8 { background-color: green; }
        .e9 { background-color: orange; }
        .e10 { background-color: mediumturquoise; }

    </style>
</head>
<body>
    <h1>시간표</h1>
    <table border="0">
        <thead>
            <tr>
                <th>    X  </th>
                <th> 월요일 </th>
                <th> 화요일 </th>
                <th> 수요일 </th>
                <th> 목요일 </th>
                <th> 금요일 </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> 09-10 </td>
                <td rowspan="2"></td>
                <td rowspan="3" class="e3"> 웹프로<br>그래밍 </td>
                <td rowspan="9"> </td>
                <td rowspan="3" class="e5"> 열역학</td>
                <td rowspan="3" class="e6"> 미적<br>분학</td>
            </tr>

            <tr>
                <td> 10-11</td>
            </tr>

            <tr>
                <td> 11-12</td>
                <td class="e4"> 채플 </td>
            </tr>

            <tr>
                <td> 12-13</td>
                <td rowspan="2"> </td>
                <td rowspan="3"> </td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>13-14</td>
                <td rowspan="3" class="e7"> 객체지<br>향프로<br>그래밍</td> 
                <td rowspan="3" class="e8"> 클라우드<br>컴퓨팅</td>
            </tr>

            <tr>
                <td>14-15</td>
                <td rowspan="3" class="e9"> 인공지<br>능개론</td>
            </tr>

            <tr>
                <td>15-16</td>
                <td rowspan="3" class="e10"> 대인관<br>계심리학</td>
                
            </tr>

            <tr>
                <td>16-17</td>
                <td rowspan="2"> </td>
                <td rowspan="2"> </td>
            </tr>

            <tr>
                <td>17-18</td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>

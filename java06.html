<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = prompt('어디까지 반복하실 건가요?')
        let num = 1;
        while( num <= number ) {
            document.write( num + '<br>');
            num++;
        }
                for( num = 1 ; num <= number ; num++ ) {
            document.write( num + '<br>'); }
    </script>
    
</body>
</html>

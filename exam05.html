<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 태그</title>
</head>
<body>
    <h1>테이블 태그</h1>
    <!-- 속성의 부분에서 빨간색으로 칠해지는 부분은 제거된 부분으로 가능하면 사용하지 말 것.-->
    <table border="1">
        <thead>
            <tr>
                <th> 제목1 </th>
                <th> 제목2 </th>
                <th> 제목3 </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2"> 내용1 </td>
                <td> 내용2 </td>
                <td> 내용3 </td>
            </tr>

            <tr>
                <td> 내용4 </td>
                <td> 내용5 </td>
            </tr>

            <tr>
                <td> 내용7 </td>
                <td> 내용8 </td>
                <td> 내용9 </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"> 꼬리1 </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>

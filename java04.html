<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let number = prompt('점수를 입력하세요');

    if ( number >= 90 ) {
        alert ('A등급 입니다.');
    }
    else if ( number >= 80 ) {
        alert ('B등급 입니다.');
    }
    else if ( number >= 70) {
        alert ('C등급 입니다.');
    }
    else if ( number >= 60 ) {
        alert ('D등급 입니다.');
    }
    else {
        alert ('F등급 입니다.');
    }
</script>
<body>
    <h1> 성적 등급 출력</h1>
</body>
</html>

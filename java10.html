<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $('.num').click(function(){
            let cur = $('#disp2').val();
            let n = $(this).val();
            $('#disp2').val(cur+n);
        });
        $('.op').click(function(){
            let cur = $('#disp2').val();
            let opt = $(this).val();
            if ( opt != "=") {
            $('#disp2').val(cur+opt);
            }
            else {
                $('#disp1').val(cur);
                $('#disp2').val(eval(cur));
            }
        });
    });
</script>

        //자바 스크립트에 split 함수도 있으니 연산자를 기준으로 쪼갤 수 있다.

<body>
